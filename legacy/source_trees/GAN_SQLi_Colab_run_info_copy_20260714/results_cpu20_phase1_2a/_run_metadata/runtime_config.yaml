schema_version: 4
seed: 88
dataset:
  raw_input: data/SQLiV3.csv.zip
  source_snapshot: data/prepared/raw/SQLiV3.csv.zip
  work_dir: data/prepared
  normal_test_fraction: 0.2
  family_holdout_fraction: 0.2
  conflict_policy: quarantine
families:
- boolean
- union
- time
- error
scenarios:
  A: baseline_old
  B: shortest_first
  C: modal_length_zone
  D: iqr_random
  E: uniform_random
  F: lexical_diversity
phase1:
  methods:
  - smote
  - gan
  - ctgan
  - seqgan_master
phase2a:
  ratio: 50
  require_exact_count: true
  methods:
  - smote
  - gan
  - ctgan
  - seqgan_master
phase2b:
  ratios:
  - full
  - 10
  - 20
  - 50
  - 100
  - 200
  - 500
  require_exact_count: true
  methods:
  - smote
  - gan
  - ctgan
  - seqgan_master
phase3:
  discriminator_reward_weight: 0.7
  variants:
  - id: V1
    sequence_length: 20
    generator_pretrain_epochs: 120
    sql_reward: false
    tokenizer_mode: raw_character
  - id: V2
    sequence_length: 160
    generator_pretrain_epochs: 120
    sql_reward: false
    tokenizer_mode: sql_aware
  - id: V3
    sequence_length: 20
    generator_pretrain_epochs: 160
    sql_reward: false
    tokenizer_mode: sql_aware
  - id: V4
    sequence_length: 160
    generator_pretrain_epochs: 160
    sql_reward: false
    tokenizer_mode: raw_character
  - id: V5
    sequence_length: 20
    generator_pretrain_epochs: 120
    sql_reward: true
    tokenizer_mode: sql_aware
  - id: V6
    sequence_length: 160
    generator_pretrain_epochs: 120
    sql_reward: true
    tokenizer_mode: raw_character
  - id: V7
    sequence_length: 20
    generator_pretrain_epochs: 160
    sql_reward: true
    tokenizer_mode: raw_character
  - id: V8
    sequence_length: 160
    generator_pretrain_epochs: 160
    sql_reward: true
    tokenizer_mode: sql_aware
generation:
  n_samples: 200
  smote:
    k_neighbors: 5
  gan:
    epochs: 15
    batch_size: 64
    noise_dim: 16
    hidden_dim: 64
    learning_rate: 0.0002
  ctgan:
    epochs: 25
    batch_size: 500
  seqgan_master:
    sequence_length: 20
    generator_pretrain_epochs: 120
    discriminator_pretrain_steps: 50
    discriminator_pretrain_epochs: 3
    adversarial_epochs: 200
    generator_steps: 1
    discriminator_steps: 5
    discriminator_epochs: 3
    rollout_count: 16
  seqgan_improved:
    discriminator_pretrain_steps: 50
    discriminator_pretrain_epochs: 3
    adversarial_epochs: 200
    generator_steps: 1
    discriminator_steps: 5
    discriminator_epochs: 3
    rollout_count: 16
quality:
  self_bleu_sample_size: 20
  calibration_margin: 0.05
detector:
  n_estimators: 30
  class_weight: balanced_subsample
  severe_macro_f1_drop: 0.1
  severe_attack_recall_drop: 0.15
outputs:
  results_root: /content/drive/MyDrive/GAN/GAN_SQLi_Colab/results_cpu20_phase1_2a
